<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coloriage Préscolaire</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="overlay-portrait">
        <p>🔄 Tourne ton appareil en mode paysage pour colorier !</p>
    </div>
    <main class="container-16-9">
        <div class="zone-gauche">
            <div class="miniature-container">
                <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" class="svg-modele">
                    <circle id="zone-soleil" class="zone-coloriable" fill="#FFFFFF" cx="320" cy="80" r="40" />
                    <polygon id="zone-toit" class="zone-coloriable" fill="#FFFFFF" points="200,50 50,200 350,200" />
                    <rect id="zone-murs" class="zone-coloriable" fill="#FFFFFF" x="100" y="200" width="200" height="150" />
                    <rect id="zone-porte" class="zone-coloriable" fill="#FFFFFF" x="160" y="250" width="50" height="100" />
                    <rect id="zone-fenetre" class="zone-coloriable" fill="#FFFFFF" x="220" y="220" width="60" height="60" />
                    <circle class="contour" fill="none" stroke="#000000" stroke-width="4" style="pointer-events: none;" cx="320" cy="80" r="40" />
                    <polygon class="contour" fill="none" stroke="#000000" stroke-width="4" style="pointer-events: none;" points="200,50 50,200 350,200" />
                    <rect class="contour" fill="none" stroke="#000000" stroke-width="4" style="pointer-events: none;" x="100" y="200" width="200" height="150" />
                    <rect class="contour" fill="none" stroke="#000000" stroke-width="4" style="pointer-events: none;" x="160" y="250" width="50" height="100" />
                    <rect class="contour" fill="none" stroke="#000000" stroke-width="4" style="pointer-events: none;" x="220" y="220" width="60" height="60" />
                </svg>
            </div>
            <div class="palette-container">
                <button class="feutre" data-color="#FF0000" aria-label="Rouge"></button>
                <button class="feutre" data-color="#0000FF" aria-label="Bleu"></button>
                <button class="feutre" data-color="#FFFF00" aria-label="Jaune"></button>
                <button class="feutre" data-color="#008000" aria-label="Vert"></button>
                <button class="feutre" data-color="#FFA500" aria-label="Orange"></button>
                <button class="feutre" data-color="#800080" aria-label="Violet"></button>
            </div>
        </div>
        <div class="zone-droite">
            <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" class="svg-principal" style="width: 100%; height: 100%;">
                <circle id="zone-soleil" class="zone-coloriable" fill="#FFFFFF" cx="320" cy="80" r="40" />
                <polygon id="zone-toit" class="zone-coloriable" fill="#FFFFFF" points="200,50 50,200 350,200" />
                <rect id="zone-murs" class="zone-coloriable" fill="#FFFFFF" x="100" y="200" width="200" height="150" />
                <rect id="zone-porte" class="zone-coloriable" fill="#FFFFFF" x="160" y="250" width="50" height="100" />
                <rect id="zone-fenetre" class="zone-coloriable" fill="#FFFFFF" x="220" y="220" width="60" height="60" />
                <circle class="contour" fill="none" stroke="#000000" stroke-width="4" style="pointer-events: none;" cx="320" cy="80" r="40" />
                <polygon class="contour" fill="none" stroke="#000000" stroke-width="4" style="pointer-events: none;" points="200,50 50,200 350,200" />
                <rect class="contour" fill="none" stroke="#000000" stroke-width="4" style="pointer-events: none;" x="100" y="200" width="200" height="150" />
                <rect class="contour" fill="none" stroke="#000000" stroke-width="4" style="pointer-events: none;" x="160" y="250" width="50" height="100" />
                <rect class="contour" fill="none" stroke="#000000" stroke-width="4" style="pointer-events: none;" x="220" y="220" width="60" height="60" />
            </svg>
        </div>
    </main>
    <script src="js/state.js"></script>
    <script src="js/palette.js"></script>
    <script src="js/drawing.js"></script>

    <script src="js/config.js"></script>
    <script src="js/modele.js"></script>
</body>
</html>
