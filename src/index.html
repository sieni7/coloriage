<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coloriage Préscolaire</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="overlay-portrait">
        <p>🔄 Tourne ton appareil en mode paysage pour colorier !</p>
    </div>
    <main class="container-16-9">
        <div class="zone-gauche">
            <div class="miniature-container">
                <div id="miniature-container" class="svg-modele"></div>
            </div>
            <div id="selector-container" class="selector-container"></div>
            <div class="palette-container">
                <button class="feutre" data-color="#FF0000" aria-label="Rouge"></button>
                <button class="feutre" data-color="#0000FF" aria-label="Bleu"></button>
                <button class="feutre" data-color="#FFFF00" aria-label="Jaune"></button>
                <button class="feutre" data-color="#008000" aria-label="Vert"></button>
                <button class="feutre" data-color="#FFA500" aria-label="Orange"></button>
                <button class="feutre" data-color="#800080" aria-label="Violet"></button>
            </div>
        </div>
        <div class="zone-droite">
            <div id="principal-container" class="svg-principal"></div>
        </div>
    </main>
    <div id="celebration-overlay" class="celebration-overlay" role="dialog" aria-modal="true" aria-labelledby="celebration-title" aria-hidden="true">
        <div class="celebration-content">
            <button id="btn-fermer" class="btn-fermer" aria-label="Fermer et admirer le dessin">&times;</button>
            <h2 id="celebration-title">Bravo !</h2>
            <button id="btn-recommencer" class="btn-recommencer" aria-label="Effacer le dessin et recommencer">Recommencer</button>
        </div>
    </div>
    <script src="js/state.js"></script>
    <script src="js/palette.js"></script>
    <script src="js/drawing.js"></script>
    <script src="js/config.js"></script>
    <script src="js/drawings.js"></script>
    <script src="js/selector.js"></script>
    <script src="js/modele.js"></script>
    <script src="js/validation.js"></script>
</body>
</html>
